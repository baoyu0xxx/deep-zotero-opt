[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-zotero"
version = "0.1.0"
description = "Deep semantic search for Zotero libraries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "sentence-transformers>=3.0.0",
    "pymupdf>=1.25.0",
    "pymupdf-layout",
    "pymupdf4llm>=0.0.17",
    "rapidocr_onnxruntime>=1.4.4",
    "onnxruntime-gpu[cuda,cudnn]",
    "fastmcp>=2.0.0",
    "tqdm>=4.0.0",
    "pydantic>=2.0.0",
    "rapidfuzz>=3.0.0",
    "opencv-python>=4.0.0",
    "camelot-py>=0.11.0",
    "pdfplumber>=0.11.0",
    # Windows/NVIDIA GPU install needs Paddle's CUDA index, e.g.
    # python -m pip install paddlepaddle-gpu==3.3.0 -i https://www.paddlepaddle.org.cn/packages/stable/cu130/
    "paddlepaddle-gpu==3.3.0",
    "paddleocr>=3.0.0",
]

[project.optional-dependencies]
vision = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "anthropic>=0.40.0",
]

[project.scripts]
deep-zotero = "deep_zotero.server:main"
deep-zotero-index = "deep_zotero.cli:main"

[tool.pytest.ini_options]
addopts = "-m 'not vision_api' -p no:cacheprovider --basetemp=pytest-cache-files-basetemp"
markers = [
    "vision_api: tests that make real Anthropic API calls (run with: pytest -m vision_api)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deep_zotero = ["data/*.csv"]
